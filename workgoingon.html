<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gemionix | Under Maintenance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f7fbff;
    color:#0b2545;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    background:#1d8cff20;
    border-radius:50%;
    top:-250px;
    right:-200px;
    filter:blur(80px);
}

body::after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:#00b7ff15;
    border-radius:50%;
    bottom:-250px;
    left:-200px;
    filter:blur(90px);
}

.container{
    width:90%;
    max-width:700px;
    background:#ffffff;
    border-radius:25px;
    padding:60px 40px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,119,255,.12);
    border:1px solid #d9ecff;
    z-index:2;
}

.logo{
    font-size:42px;
    font-weight:700;
    color:#0077ff;
    letter-spacing:1px;
}

.logo span{
    color:#0b2545;
}

.icon{
    font-size:70px;
    margin:30px 0;
    animation:spin 8s linear infinite;
}

h1{
    font-size:42px;
    color:#0b2545;
    margin-bottom:10px;
}

h2{
    color:#0077ff;
    font-weight:500;
    margin-bottom:25px;
}

p{
    color:#555;
    font-size:18px;
    line-height:1.8;
}

.loader{
    width:70px;
    height:70px;
    margin:35px auto;
    border:6px solid #dcecff;
    border-top:6px solid #0077ff;
    border-radius:50%;
    animation:rotate 1s linear infinite;
}

.footer{
    margin-top:20px;
    color:#888;
    font-size:14px;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:600px){

.logo{
    font-size:32px;
}

h1{
    font-size:30px;
}

p{
    font-size:16px;
}

.container{
    padding:40px 25px;
}

}
</style>

</head>

<body>

<div class="container">

<div class="logo">
Gemio<span>nix</span>
</div>

<div class="icon">⚙️</div>

<h1>Website Under Maintenance</h1>

<h2>🚧 Under Construction 🚧</h2>

<p>
Our website is currently undergoing scheduled maintenance and improvements.<br><br>
We're building something better for you.<br>
Please check back soon.
</p>

<div class="loader"></div>

<div class="footer">
© 2026 Gemionix™<br>
We Odia. We Innovate Badhiya.
</div>

</div>

</body>
</html>
